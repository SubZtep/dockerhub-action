name: Docker Build & Push
description: Build and push multi-arch Docker images to Docker Hub
author: Andras Serfozo <subztep@gmail.com>

branding:
  icon: upload-cloud
  color: purple

inputs:
  dockerhub_username:
    description: Docker Hub username
    required: true

  dockerhub_token:
    description: Docker Hub personal access token
    required: true

  dockerhub_repository:
    description: Image name (e.g. user/app)
    required: true

  version:
    description: Image tag (e.g. 1.0.0 or latest)
    default: latest

  push_latest:
    description: Also push :latest
    default: "true"

  platforms:
    description: Target platforms
    default: linux/amd64,linux/arm64

  docker_context:
    description: Build context path
    default: .

  dockerfile:
    description: Dockerfile path
    default: Dockerfile

  build_args:
    description: Docker build args
    default: ""

outputs:
  image:
    description: Full image name
    value: ${{ steps.meta.outputs.image }}

runs:
  using: composite
  steps:
    - name: 📥 Checkout
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: 🧠 Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: 🔧 Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: 🏷 Prepare tags
      id: meta
      shell: bash
      run: |
        IMAGE="${{ inputs.dockerhub_repository }}"
        VERSION="${{ inputs.version }}"

        TAGS="$IMAGE:$VERSION"

        if [ "${{ inputs.push_latest }}" = "true" ] && [ "$VERSION" != "latest" ]; then
          TAGS="$TAGS,$IMAGE:latest"
        fi

        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "tags=$TAGS" >> $GITHUB_OUTPUT

    - name: 🚀 Build & Push
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.docker_context }}
        file: ${{ inputs.dockerfile }}
        push: true
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.meta.outputs.tags }}

        labels: |
          org.opencontainers.image.source=${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

        build-args: ${{ inputs.build_args }}

        cache-from: type=gha
        cache-to: type=gha,mode=max

name: DockerHub Action
description: Build and Release to Docker Hub
author: Andras Serfozo <subztep@gmail.com>

branding:
  icon: upload-cloud
  color: purple

inputs:
  checkout_ref:
    description: Git reference to checkout (branch, tag, or commit)
    required: false
    default: main
  dockerhub_username:
    description: Docker Hub username
    required: true
  dockerhub_token:
    description: Docker Hub authentication token
    required: true
  dockerhub_repository:
    description: Docker image name
    required: true
  docker_platforms:
    description: Comma-delimited string of build platforms
    required: false
    default: linux/amd64,linux/arm64/v8
  docker_context:
    description: Dockerfile location in the repo
    required: false
    default: .
  dockerfile:
    description: Dockerfile location in the repo
    required: false
    default: Dockerfile
  version:
    description: Docker Hub release tag
    required: false
    default: latest

outputs:
  inspect_output:
    description: Output from docker image inspect for the built image (JSON)
    value: ${{ steps.inspect_image.outputs.inspect_output }}

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        platforms: ${{ inputs.docker_platforms }}

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: 🍺 Build and Push Docker image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        load: true
        push: true
        tags: |
          ${{ inputs.dockerhub_repository }}:latest
          ${{ inputs.version != 'latest' && format('{0}:{1}', inputs.dockerhub_repository, inputs.version) || '' }}

    - name: Inspect image and set output
      id: inspect_image
      shell: bash
      run: |
        inspect_out=$(docker image inspect "${{ inputs.dockerhub_repository }}:${{ inputs.version }}")
        echo "$inspect_out"
        echo "inspect_output<<EOF" >> $GITHUB_OUTPUT
        echo "$inspect_out" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

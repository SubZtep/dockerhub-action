name: Docker Build & Push
description: Build and push multi-arch Docker images to Docker Hub
author: Andras Serfozo <subztep@gmail.com>

branding:
  icon: upload-cloud
  color: purple

inputs:
  dockerhub_username:
    description: Docker Hub username
    required: true

  dockerhub_token:
    description: Docker Hub personal access token
    required: true

  dockerhub_repository:
    description: Image name (e.g. user/app)
    required: true

  version:
    description: Image tag (e.g. 1.0.0); defaults to the pushed git tag without leading v, otherwise latest
    default: ""

  push_latest:
    description: Also push :latest
    default: "true"

  platforms:
    description: Target platforms
    default: linux/amd64,linux/arm64

  docker_context:
    description: Build context path
    default: .

  dockerfile:
    description: Dockerfile path
    default: Dockerfile

  build_args:
    description: Docker build args
    default: ""

  checkout:
    description: Check out the repository (set false to keep files built in earlier steps)
    default: "true"

  checkout_ref:
    description: Git ref to checkout (defaults to the triggering ref)
    default: ""

  sbom:
    description: Attach an SBOM attestation
    default: "true"

  provenance:
    description: Provenance attestation (false, mode=min or mode=max)
    default: mode=max

  cache_scope:
    description: GHA cache scope (defaults to dockerhub_repository)
    default: ""

outputs:
  image:
    description: Full image name
    value: ${{ steps.meta.outputs.image }}

  version:
    description: Resolved image tag
    value: ${{ steps.meta.outputs.version }}

runs:
  using: composite
  steps:
    - name: 📥 Checkout
      if: inputs.checkout == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.checkout_ref }}

    - name: 🧠 Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: 🔧 Set up Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: 🏷 Prepare tags
      id: meta
      shell: bash
      # Passed via env so tag names can't inject shell code
      env:
        IMAGE: ${{ inputs.dockerhub_repository }}
        VERSION: ${{ inputs.version }}
        PUSH_LATEST: ${{ inputs.push_latest }}
      run: |
        if [ -z "$VERSION" ]; then
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=latest
          fi
        fi

        TAGS="$IMAGE:$VERSION"

        if [ "$PUSH_LATEST" = "true" ] && [ "$VERSION" != "latest" ]; then
          TAGS="$TAGS,$IMAGE:latest"
        fi

        echo "image=$IMAGE" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tags=$TAGS" >> $GITHUB_OUTPUT

    - name: 🚀 Build & Push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.docker_context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.meta.outputs.tags }}
        push: true
        sbom: ${{ inputs.sbom }}
        provenance: ${{ inputs.provenance }}

        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

        build-args: ${{ inputs.build_args }}

        # Input defaults can't reference other inputs, so fall back here
        cache-from: type=gha,scope=${{ inputs.cache_scope || inputs.dockerhub_repository }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope || inputs.dockerhub_repository }}

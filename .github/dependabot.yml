version: 2
updates:
  # "/" covers both the root action.yaml and .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # One PR per week means one release per week; majors stay separate for manual review
      actions:
        update-types: [minor, patch]

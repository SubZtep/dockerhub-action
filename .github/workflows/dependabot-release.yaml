name: Dependabot auto-release

# pull_request_target gives Dependabot a writable token; safe because no PR code is checked out
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-release

jobs:
  merge-and-release:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: 🔍 Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: 🔀 Merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge "$PR_URL" --squash --delete-branch

      # Done here because pushes made with GITHUB_TOKEN don't trigger other workflows
      - name: 🏷 Release
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          # Workflow-only bumps don't change what users run, so skip releasing them
          if ! gh pr diff "$PR_URL" --name-only | grep -qx action.yaml; then
            echo "action.yaml unchanged, no release"
            exit 0
          fi

          SHA=$(gh pr view "$PR_URL" --json mergeCommit --jq .mergeCommit.oid)
          LATEST=$(gh release view --json tagName --jq .tagName)
          IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
          NEXT="v$MAJOR.$MINOR.$((PATCH + 1))"

          gh release create "$NEXT" --target "$SHA" --title "$NEXT" --generate-notes

          # Floating major tag so users on @v1 get updates without changing their workflows
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/v$MAJOR" -f sha="$SHA" -F force=true
